<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PHOTOS</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="grid" class="grid"></div>

  <div id="overlay" class="overlay">
    <div class="panel">
      <input id="search" type="text" placeholder="Hledat fotky, mista, vylety...">

      <div class="tag-section">
        <h3>Cestovani</h3>
        <div id="tags-cestovani" class="tag-list"></div>
      </div>
      <div class="tag-section">
        <h3>Zeme</h3>
        <div id="tags-zeme" class="tag-list"></div>
      </div>
      <div class="tag-section">
        <h3>Akce</h3>
        <div id="tags-akce" class="tag-list"></div>
      </div>

      <div class="trips-section">
        <h3>Posledni vylety</h3>
        <div id="trips" class="trips-list"></div>
      </div>

      <div id="active-filter" class="active-filter" hidden>
        <span id="active-filter-label"></span>
        <button id="clear-filter">Zrusit filtr</button>
      </div>
    </div>
  </div>

  <button id="upload-btn" class="fab" title="Nahrat fotky">+</button>
  <input id="upload-input" type="file" accept="image/*" multiple hidden>

  <div id="lightbox" class="lightbox" hidden>
    <button id="lightbox-close" class="lightbox-close">&times;</button>
    <img id="lightbox-img" src="" alt="">
    <div id="lightbox-tags" class="lightbox-tags"></div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
