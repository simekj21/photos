<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galerie</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <span class="topbar__title">Galerie</span>
  <button id="theme-toggle" class="icon-btn" aria-label="Přepnout tmavý režim">
    <svg id="theme-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
  </button>
</header>

<div id="dropzone" class="dropzone">
  <p class="dropzone__text">Přetáhněte sem fotky, nebo</p>
  <button id="pick-files" class="btn">vybrat fotky</button>
  <input id="file-input" type="file" accept="image/*" multiple hidden>
  <p id="upload-status" class="dropzone__status"></p>
</div>

<main id="gallery" class="gallery"></main>

<div id="lightbox" class="lightbox" hidden>
  <button id="lb-close" class="icon-btn lightbox__close" aria-label="Zavřít">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
  </button>
  <button id="lb-prev" class="icon-btn lightbox__nav lightbox__nav--prev" aria-label="Předchozí">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
  </button>
  <img id="lb-image" class="lightbox__image" alt="">
  <button id="lb-next" class="icon-btn lightbox__nav lightbox__nav--next" aria-label="Další">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
  </button>
</div>

<script src="js/app.js"></script>
</body>
</html>
